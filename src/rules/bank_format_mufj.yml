# rules/bank_format_mufj.yml
version: 1
format_id: mufj_table_v1
source_kind: bank_statement

encoding:
  expected: ["utf-8", "cp932", "shift_jis"]

table:
  header_row: 1
  allow_extra_columns: true
  trim_whitespace: true

header_aliases:
  date: ["日付", "年月日"]
  summary: ["摘要", "内容"]
  summary_detail: ["摘要内容", "取引内容詳細", "内容詳細"]
  amount_out: ["支払い金額", "支払金額", "お支払金額"]
  amount_in: ["預かり金額", "お預り金額", "入金額"]
  balance: ["差引残高", "残高"]
  memo: ["メモ", "備考"]
  float_flag: ["未資金化区分"]
  io_flag: ["入払区分"]

parsing:
  date:
    formats: ["%Y/%m/%d", "%Y-%m-%d", "%Y.%m.%d"]
    timezone: "Asia/Tokyo"
  number:
    thousands_sep: [","]
    currency_symbols: ["¥", "円"]
    empty_as_zero: true
    allow_parentheses_negative: true

normalize:
  output_schema: normalized_transaction_v1
  fields:
    tx_date: { from: date }
    # 摘要＋摘要内容を連結して説明文に（どちらか片方だけでもOK）
    description:
      concat:
        - { from: summary }
        - " "
        - { from: summary_detail }
      postprocess:
        - op: "collapse_spaces"
        - op: "strip"
    memo: { from: memo }
    amount_out: { from: amount_out }
    amount_in:  { from: amount_in }
    balance: { from: balance }
    # UFJ固有列は付帯情報として保持（あとでルール側に使える）
    attributes:
      float_flag: { from: float_flag }
      io_flag: { from: io_flag }

rules:
  # 入出金判定はPython側で実装 (MVP)
  # UFJはio_flag優先 → 金額ベースfallback
  direction: "io_flag_with_amount_fallback"

validations:
  - id: both_in_out_positive
    level: warn
    when: "amount_out > 0 and amount_in > 0"
    message: "支払と預りが同時に入っています（要確認）"
  - id: date_required
    level: error
    when: "tx_date is null"
    message: "日付が読めません"
